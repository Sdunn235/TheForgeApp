<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Forge v0.0.1</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Our styles, loaded last so they win -->
    <link rel="stylesheet" href="css/forge.css">
</head>


<body>
    <div class="video-hero">
        <iframe
            src="https://www.youtube.com/embed/ez68sFkO6Qo?autoplay=1&mute=1&loop=1&playlist=ez68sFkO6Qo&controls=0&playsinline=1"
            title="Background video" allow="autoplay; encrypted-media" allowfullscreen>
        </iframe>
    </div>

    <!-- Main content: one card per design area -->
    <!-- Page heading -->
    <div id="app" class="container text-start mt-5 pt-5">
        <app-navbar active="home"></app-navbar>
        <page-content-header :title="appName" :description="tagline"></page-content-header>

        <!-- One card per forge. The frame lives in AppCard; the words for
            each one live in forges in app.js. -->
        <div class="row row-cols-1 row-cols-md-2 g-4">
            <div class="col" v-for="forge in forges" :key="forge.title">
                <app-card :title="forge.title" :description="forge.description" :image="forge.image"
                    :image-alt="forge.alt">
                    <template #footer>
                        <action-menu class="d-grid" variant="button" :items="forge.links"
                            :label="forge.buttonLabel"></action-menu>
                    </template>
                </app-card>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <!-- Vue: mounts the app onto #app -->
    <script type="module">
        import app from "./scripts/app.js";
        app.mount("#app");
    </script>
</body>

</html>
