<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Forge v0.0.1</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Our styles, loaded last so they win -->
    <link rel="stylesheet" href="css/forge.css">
</head>


<body>
    <!-- Navbar -->
    <!-- Hidden below lg, where the bottom bar takes over -->
    <nav class="navbar fixed-top navbar-expand-lg bg-primary d-none d-lg-flex" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="./index.html">The Forge</a>

            <ul class="navbar-nav flex-row ms-auto me-3">
                <li class="nav-item">
                    <a class="nav-link px-3 active" href="./index.html" aria-current="page">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3" href="./creation-character.html">Forge Character</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3" href="./view-characters.html">Roster</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Takes over below lg, where the top bar is hidden -->
    <nav class="navbar fixed-bottom bg-primary d-lg-none mobile-bottom-nav" data-bs-theme="dark">
        <div class="container-fluid">
            <ul class="navbar-nav flex-row w-100 justify-content-around">
                <li class="nav-item">
                    <a class="nav-link text-center active" href="./index.html" aria-current="page">
                        <i class="bi bi-house-door d-block"></i>
                        Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-center" href="./creation-character.html">
                        <i class="bi bi-hammer d-block"></i>
                        Create
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-center" href="./view-characters.html">
                        <i class="bi bi-people d-block"></i>
                        Roster
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="video-hero">
        <iframe
            src="https://www.youtube.com/embed/ez68sFkO6Qo?autoplay=1&mute=1&loop=1&playlist=ez68sFkO6Qo&controls=0&playsinline=1"
            title="Background video" allow="autoplay; encrypted-media" allowfullscreen>
        </iframe>
    </div>

    <!-- Main content: one card per design area -->
    <!-- Page heading -->
    <div id="app" class="container text-start mt-5 pt-5">
        <div class="row bg-secondary mb-4 px-2 row-cols-1 g-0 page-heading">
            <div class="container col">
                <h1 class="display-1 pb-2 border-bottom border-primary">{{ appName }}</h1>
                <p class="lead">{{ tagline }}</p>
            </div>
        </div>

        <!-- One card per forge. The shape lives here once; the words for each
            one live in forges in app.js. -->
        <div class="row row-cols-1 row-cols-md-2 g-4">
            <div class="col" v-for="forge in forges" :key="forge.title">
                <div class="card h-100"><img :src="forge.image" :alt="forge.alt">
                    <div class="card-body">
                        <h3 class="card-title">{{ forge.title }}</h3>
                        <p class="card-text pt-2">{{ forge.description }}</p>
                    </div>
                    <div class="card-body flex-grow-0">
                        <div class="dropdown d-grid">
                            <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                {{ forge.buttonLabel }}
                            </button>
                            <ul class="dropdown-menu dropdown-menu-lg-end">
                                <li v-for="link in forge.links" :key="link.label">
                                    <a class="dropdown-item" :href="link.href">{{ link.label }}</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <!-- Vue: mounts the app onto #app -->
    <script type="module">
        import app from "./scripts/app.js";
        app.mount("#app");
    </script>
</body>

</html>
